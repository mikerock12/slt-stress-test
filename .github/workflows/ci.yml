name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build

  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish plugin/SLTStressTest.Plugin -c Release -o plugin/publicado
      - uses: actions/upload-artifact@v4
        with:
          name: SLTStressTestPlugin
          path: plugin/publicado/SLTStressTestPlugin.exe
