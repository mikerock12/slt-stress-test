name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
      - run: npx --yes wrangler@4 deploy --dry-run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug lintDebug
      - run: node scripts/testar-cargas-android.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SLTStressTestAndroid-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk

  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish plugin/SLTStressTest.Plugin -c Release -o plugin/publicado
      - name: Conferir recursos e integridade do driver incluído (sem instalar)
        shell: pwsh
        run: |
          $verificacao = Start-Process -FilePath plugin/publicado/SLTStressTestPlugin.exe -ArgumentList '--verificar-pacote' -PassThru -Wait -WindowStyle Hidden
          if ($verificacao.ExitCode -ne 0) { throw 'Pacote PawnIO inválido.' }
      - uses: actions/upload-artifact@v4
        with:
          name: SLTStressTestPlugin
          path: plugin/publicado/SLTStressTestPlugin.exe
